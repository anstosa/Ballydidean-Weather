          # exercise the integrated native maintenance receipt/controller paths with the candidate codec
          for filter in native_maintenance_terminal_seal_owner native_maintenance_terminal_record_remote \
            native_maintenance_qualified_release_package native_maintenance_control_reference_semantic \
            controller_run_serialization_preserves_source_optional_fields \
