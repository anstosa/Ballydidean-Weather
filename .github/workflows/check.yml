            cargo test --locked --offline --target aarch64-unknown-linux-gnu -p weather-runtime \
              --features node-zlib-candidate --lib "$filter" | tee "$CARGO_TARGET_DIR/controller-test-result.log"
            grep -Eq '^test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$CARGO_TARGET_DIR/controller-test-result.log"
          done
          cargo test --locked --offline --target aarch64-unknown-linux-gnu -p weather-runtime \
            --features node-zlib-candidate --bin weather-maintenance-capture \
            non_installed_candidate_cannot_construct_controller_owner | tee "$CARGO_TARGET_DIR/controller-command-result.log"
          grep -Eq '^test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$CARGO_TARGET_DIR/controller-command-result.log"
          # require the exact pinned Node fork on native ARM64 before candidate adoption
          (cd crates/weather-runtime/vendor/node-zlib-24.16.0 && sha256sum -c --quiet source.sha256)
          cargo test --locked --offline --target aarch64-unknown-linux-gnu -p weather-runtime --features node-zlib-candidate --lib native_node_gzip_candidate |
            tee "$CARGO_TARGET_DIR/gzip-candidate-result.log"
          grep -Eq '^test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$CARGO_TARGET_DIR/gzip-candidate-result.log"
      - name: Set up the native candidate image builder
        uses: docker/setup-buildx-action@v3
      - name: Build native ARM64 candidate images and independent expected material
        shell: bash
        run: |
          set -euo pipefail
          material_root=$(mktemp -d "${RUNNER_TEMP}/weather-native-build-material.XXXXXX")
          printf '%s\n' "${material_root}" > "${RUNNER_TEMP}/weather-native-build-material-root"
          docker buildx build --platform linux/arm64 --target native-server \
            --build-arg "WEATHER_SOURCE_REVISION=${GITHUB_SHA}" \
            --provenance=false --tag weather-native-server:check --load .
          docker buildx build --platform linux/arm64 --target native-web \
            --build-arg "WEATHER_SOURCE_REVISION=${GITHUB_SHA}" \
            --build-arg "WEATHER_WEB_REVISION=${GITHUB_SHA}" \
            --provenance=false --tag weather-native-web:check --load .
          # export comparison bytes from the build graph, never from either runtime image
          docker buildx build --platform linux/arm64 --target native-runtime-material-build \
            --provenance=false --output "type=local,dest=${material_root}" .
      - name: Inspect loaded native ARM64 image configuration and material
        shell: bash
        run: |
          set -euo pipefail
          material_root=$(cat "${RUNNER_TEMP}/weather-native-build-material-root")
          inspection_root=$(mktemp -d "${RUNNER_TEMP}/weather-native-image-inspection.XXXXXX")
          server_root="${inspection_root}/server"
          web_root="${inspection_root}/web"
          mkdir -p "${server_root}" "${web_root}"
          server_container=
          web_container=
          # remove partial container state and disposable extracted material on every exit
          cleanup() {
            test -z "${server_container}" || docker rm --force "${server_container}" >/dev/null
            test -z "${web_container}" || docker rm --force "${web_container}" >/dev/null
            rm -rf -- "${inspection_root}" "${material_root}"
          }
          trap cleanup EXIT
          docker image inspect weather-native-server:check > "${inspection_root}/server-image.json"
          docker image inspect weather-native-web:check > "${inspection_root}/web-image.json"
          node --input-type=module - \
            "${inspection_root}/server-image.json" \
            "${inspection_root}/web-image.json" <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";

          // verify one loaded image's platform and non-Node startup boundary
          function verifyImage(path, command, environment) {
            const [image] = JSON.parse(readFileSync(path, "utf8"));
            assert.equal(image.Architecture, "arm64");
            assert.equal(image.Os, "linux");
            assert.equal(image.Config.User, "10002:10002");
            assert.equal(image.Config.WorkingDir, "/opt/weather");
            // Docker versions serialize an unset optional field as null or omit it
            assert.equal(image.Config.Entrypoint ?? null, null);
            assert.deepEqual(image.Config.Cmd, command);
            assert.deepEqual(image.Config.Env, environment);
            assert.deepEqual(image.Config.Labels, {
              "org.opencontainers.image.revision": process.env.GITHUB_SHA,
              "org.weather.runtime.generation": "rust-v1",
            });
            assert.equal(image.Config.Healthcheck ?? null, null);
            assert.equal(image.Config.ExposedPorts ?? null, null);
            assert.equal(image.Config.Volumes ?? null, null);
          }

          const pathEnvironment = "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin";
          verifyImage(
            process.argv[2],
            ["/opt/weather/bin/weather-api"],
            [pathEnvironment, "NODE_ENV=production"],
          );
          verifyImage(
            process.argv[3],
            ["/opt/weather/bin/weather-web"],
            [
              pathEnvironment,
              "NODE_ENV=production",
              "WEATHER_SITE_CONFIG_PATH=/opt/weather/edge-config/ballydidean.json",
              `WEATHER_WEB_REVISION=${process.env.GITHUB_SHA}`,
            ],
          );
          NODE
          server_container=$(docker create weather-native-server:check)
          web_container=$(docker create weather-native-web:check)
          docker cp "${server_container}:/opt/weather/." "${server_root}/"
          docker cp "${web_container}:/opt/weather/." "${web_root}/"
          node deploy/scripts/build-native-runtime-image-material.mjs \
            "${GITHUB_SHA}" "${GITHUB_WORKSPACE}" "${material_root}" \
            > "${inspection_root}/expected.json"
          node deploy/scripts/rust-runtime-image-material.mjs --inspect \
            "${inspection_root}/expected.json" "${server_root}" "${web_root}" \
            > "${inspection_root}/inspection.json"
          node --input-type=module - "${inspection_root}/inspection.json" <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";

          const inspection = JSON.parse(readFileSync(process.argv[2], "utf8"));
          assert.equal(inspection.artifactClass, "offline-extracted-image-material-inspection");
          assert.deepEqual(inspection.platform, { architecture: "arm64", os: "linux" });
          assert.equal(inspection.images.length, 2);
          assert.equal(inspection.images[0].name, "server");
          assert.equal(inspection.images[1].name, "web");
          assert.equal(inspection.inspection.extractedFileBytes, true);
          assert.equal(inspection.inspection.provesElfArchitecture, true);
          NODE

  native-android:
    name: Native Android
    needs: change-selection
    if: needs.change-selection.outputs.native_android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out exact selected commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          cache: gradle
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - name: Install Android emulator runtime libraries
        run: sudo apt-get update && sudo apt-get install --yes libpulse0
      - name: Install pinned Android packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            'platform-tools' \
            'emulator' \
            'platforms;android-36' \
            'platforms;android-37.0' \
            'build-tools;36.0.0' \
            'system-images;android-36;default;x86_64'
          sudo chmod 0666 /dev/kvm
      - name: Verify wrapper and toolchain pins
        env:
          RESULTS: ${{ runner.temp }}/weather-android
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RESULTS}"
          mobile/android/scripts/verify-wrapper.sh | tee "${RESULTS}/wrapper.txt"
          mobile/android/scripts/toolchain-receipt.sh | tee "${RESULTS}/toolchain.txt"
          java mobile/android/scripts/GenerateBrandAssets.java --check \
            | tee "${RESULTS}/brand-assets.txt"
      - name: Build test and lint Android artifacts
        shell: bash
        run: |
          set -euo pipefail
          source mobile/android/scripts/android-env.sh
          mobile/android/gradlew -p mobile/android --no-daemon \
            :app:testDebugUnitTest \
            :app:lintDebug \
            :app:assembleDebug \
            :app:lintRelease \
            :app:assembleRelease
      - name: Exercise the real Android HTTPS hosted shell
        env:
          RESULTS: ${{ runner.temp }}/weather-android
        shell: bash
        run: |
          set -euo pipefail
          mobile/scripts/with-native-https-fixture.sh \
            --evidence-dir "${RESULTS}/https-fixture" \
            -- mobile/android/scripts/run-hosted-shell-tests.sh \
            "${RESULTS}/android-webview"
      - name: Verify unsigned Android Release isolation
        env:
          RESULTS: ${{ runner.temp }}/weather-android
        shell: bash
        run: |
          set -euo pipefail
          source mobile/android/scripts/android-env.sh
          mobile/android/scripts/verify-release-artifact.sh | tee "${RESULTS}/release-scan.txt"
          test -f mobile/android/app/build/outputs/apk/debug/app-debug.apk
          test -f mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk
          sha256sum \
            mobile/android/app/build/outputs/apk/debug/app-debug.apk \
            mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk \
            > "${RESULTS}/apk-sha256.txt"
          test -s \
            mobile/android/app/build/outputs/androidTest-results/managedDevice/debug/widgetPhone/TEST-widgetPhone.xml
          test -s "${RESULTS}/android-webview/TEST-widgetPhone.xml"
          test -d mobile/android/app/build/reports/androidTests/managedDevice
          python3 - "${RESULTS}/android-webview/TEST-widgetPhone.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as element_tree

          receipt = element_tree.parse(sys.argv[1]).getroot()
          expected = {"errors": "0", "failures": "0", "skipped": "0", "tests": "29"}
          # require the complete real-hosted journey count
          if any(receipt.attrib.get(name) != value for name, value in expected.items()):
              raise SystemExit(f"unexpected Android hosted-shell result: {receipt.attrib}")
          PY
      - name: Retain Android build and host evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          if-no-files-found: error
          name: native-android-${{ github.sha }}
          path: |
            ${{ runner.temp }}/weather-android/**
            mobile/android/app/build/outputs/apk/**
            mobile/android/app/build/outputs/androidTest-results/**
            mobile/android/app/build/outputs/managed_device_android_test_additional_output/**
            mobile/android/app/build/reports/**
            mobile/android/app/build/test-results/**
          retention-days: 14

  check-complete:
    name: Required Check jobs
    if: always()
    needs:
      - change-selection
      - quality-gates
      - native-android
      - native-rust-arm64
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Enforce selected job results
        env:
          CI_CHANGES_MODE: aggregate
          CI_CHANGE_SELECTION_RESULT: ${{ needs.change-selection.result }}
          CI_NATIVE_ANDROID: ${{ needs.change-selection.outputs.native_android }}
          CI_NATIVE_ANDROID_RESULT: ${{ needs.native-android.result }}
          CI_NATIVE_RUST_ARM64: ${{ needs.change-selection.outputs.native_rust_arm64 }}
          CI_NATIVE_RUST_ARM64_RESULT: ${{ needs.native-rust-arm64.result }}
          CI_QUALITY_GATES_RESULT: ${{ needs.quality-gates.result }}
        run: node scripts/ci-changes.mjs
