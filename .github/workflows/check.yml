name: Check

on:
  pull_request:
  push:
    branches:
      - '**'
  schedule:
    - cron: '19 8 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  change-selection:
    runs-on: ubuntu-latest
    outputs:
      deploy_integration: ${{ steps.changes.outputs.deploy_integration }}
      full_browser: ${{ steps.changes.outputs.full_browser }}
      full_tests: ${{ steps.changes.outputs.full_tests }}
      integration: ${{ steps.changes.outputs.integration }}
      native_android: ${{ steps.changes.outputs.native_android }}
      native_rust_arm64: ${{ steps.changes.outputs.native_rust_arm64 }}
    steps:
      - name: Check out exact workflow commit
        uses: actions/checkout@v4
        with:
          # retain the merge base and historical deployment tags
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - id: baseline
        name: Resolve comparison baseline
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_PREVIOUS_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          baseline=${CI_PREVIOUS_SHA}
          if [[ "${CI_EVENT}" == "pull_request" ]]; then
            baseline=$(git merge-base "${baseline}" "${CI_HEAD_SHA}" || true)
          fi
          printf 'sha=%s\n' "${baseline}" >> "${GITHUB_OUTPUT}"
      - id: trusted-baseline
        name: Check exact baseline validation
        if: steps.baseline.outputs.sha != ''
        env:
          CI_CHECK_MODE: baseline
          CI_SHA: ${{ steps.baseline.outputs.sha }}
          CI_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/await-check.mjs
      - id: changes
        name: Select conservative dependent suites
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE_SHA: ${{ steps.baseline.outputs.sha }}
          CI_BASE_VERIFIED: ${{ steps.trusted-baseline.outputs.baseline_verified }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: node scripts/ci-changes.mjs

  quality-gates:
    needs: change-selection
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact selected commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm ci
      - name: Verify the current runtime inventory
        shell: bash
        run: |
          set -euo pipefail
          npm run runtime-inventory:check -- --generation node-v1 --phase baseline
          npm run runtime-inventory:check -- --generation node-v1 --phase rollback-drill
          npm run runtime-inventory:check -- --generation mixed --phase pre-cutover
          npm run runtime-inventory:check -- --generation rust-v1 --phase pre-cutover
      - name: Install deployment validators
        run: sudo apt-get update && sudo apt-get install --yes age shellcheck
      - name: Lint repository
        run: npm run lint
      - name: Verify native project structure
        run: npm run verify:mobile-static
      - name: Verify the shared native HTTPS fixture
        run: python3 mobile/scripts/native_https_fixture_test.py
      - name: Verify native benchmark support contracts
        shell: bash
        run: |
          set -euo pipefail
          # run each standalone suite without requiring private host evidence
          for suite in scripts/native-benchmark-*.test.py; do
            python3 "$suite"
          done
      - name: Build and typecheck once
        run: npm run build
      - name: Prove the nested Rust toolchain pin supersedes the runner default
        shell: bash
        run: |
          set -euo pipefail
          pinned=$(sed -nE 's/^channel = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' rust/rust-toolchain.toml)
          test -n "${pinned}"
          # use a fixed control so the moving stable channel cannot collide with the nested pin
          control=1.85.1
          test "${control}" != "${pinned}"
          test -z "${RUSTUP_TOOLCHAIN+x}"
          rustup toolchain install "${control}" --profile minimal
          rustup default "${control}"
          root_toolchain=$(rustup show active-toolchain)
          root_version=$(rustc -Vv)
          printf 'repository root:\n%s\n%s\n' "${root_toolchain}" "${root_version}"
          [[ "${root_toolchain}" == "${control}-"*' (default)' ]]
          test "$(awk '$1 == "release:" { print $2 }' <<< "${root_version}")" = "${control}"
          rustup toolchain install "${pinned}" --profile minimal --component clippy --component rustfmt
          (
            # prove cwd selected the actual pin file rather than an equivalent override
            cd -P rust
            active=$(rustup show active-toolchain)
            version=$(rustc -Vv)
            printf 'nested Rust workspace:\n%s\n%s\n' "${active}" "${version}"
            [[ "${active}" == "${pinned}-"*" (overridden by '${PWD}/rust-toolchain.toml')" ]]
            test "$(awk '$1 == "release:" { print $2 }' <<< "${version}")" = "${pinned}"
          )
      - name: Verify the locked Rust backend workspace
        shell: bash
        run: |
          set -euo pipefail
          node scripts/generate-rust-contracts.mjs --check
          node --harmony-temporal scripts/native-calendar-compatibility.mjs --check rust/crates/weather-runtime/native-calendar/america-los-angeles-node-24.16.0.bin
          # keep native host dispatch and publication fixtures in the exact-commit gate
          node --test --test-concurrency=1 \
            deploy/scripts/rust-runtime-image-material.test.mjs \
            deploy/scripts/build-native-runtime-image-material.test.mjs \
            deploy/scripts/native-dashboard-release-control.test.mjs \
            deploy/scripts/native-evidence-remote-dispatch.test.mjs \
            deploy/scripts/native-generation-remote-ops.test.mjs \
            deploy/scripts/native-release-control-remote-dispatch.test.mjs
          # run only standalone oracles here; the Rust tests invoke the others
          node rust/crates/weather-api/tests/current-node-oracle.mjs
          node rust/crates/weather-api/tests/daily-precipitation-node-oracle.mjs
          node rust/crates/weather-api/tests/forecast-temperature-node-oracle.mjs
          node rust/crates/weather-api/tests/forecast-wind-node-oracle.mjs
          node rust/crates/weather-api/tests/forecast-rain-node-oracle.mjs
          node rust/crates/weather-api/tests/maintenance-schedule-node-oracle.mjs
          node rust/crates/weather-api/tests/sites-node-oracle.mjs
          node rust/crates/weather-api/tests/startup-node-oracle.mjs
          node rust/crates/weather-database/tests/active-sites-node-oracle.mjs
          node rust/crates/weather-database/tests/current-weather-node-oracle.mjs
          node rust/crates/weather-database/tests/database-config-node-oracle.mjs
          node rust/crates/weather-database/tests/migration-execution-node-oracle.mjs
          node rust/crates/weather-database/tests/migration-planning-node-oracle.mjs
          node rust/crates/weather-worker/tests/worker-startup-node-oracle.mjs
          # bind the compile checks to the nested workspace pin
          pinned=$(sed -nE 's/^channel = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' rust/rust-toolchain.toml)
          actual_rust_version="$(cd rust && rustc --version | awk '{ print $2 }')"
          printf 'rustc %s (pinned %s)\n' "${actual_rust_version}" "${pinned}"
          test -n "${pinned}"
          test "${actual_rust_version}" = "${pinned}"
          export CARGO_TARGET_DIR
          CARGO_TARGET_DIR="$(mktemp -d "${RUNNER_TEMP:-/tmp}/weather-rust-target.XXXXXX")"
          trap 'rm -rf -- "${CARGO_TARGET_DIR}"' EXIT
          # populate the exact approved locked dependency graph before offline validation
          (cd rust && cargo fetch --locked)
          node scripts/check-rust-source-quality.mjs
          # verify vendor identity and exercise the candidate compressor without selecting it for deployment
          (cd rust/crates/weather-runtime/vendor/node-zlib-24.16.0 && sha256sum -c --quiet source.sha256)
          (cd rust && cargo test --workspace --all-targets --locked --offline --features weather-runtime/node-zlib-candidate)
      - name: Verify the shared widget contract
        run: npm run test:mobile-shared:compiled
      - name: Run compiled unit tests
        env:
          FULL_TESTS: ${{ needs.change-selection.outputs.full_tests }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${FULL_TESTS}" == "true" ]]; then
            npm run test:compiled
          else
            npm run test:fast:compiled
          fi
      - name: Run PostgreSQL integration gates
        if: needs.change-selection.outputs.integration == 'true'
        run: npm run test:integration:compiled
      - name: Run browser gates
        env:
          FULL_BROWSER: ${{ needs.change-selection.outputs.full_browser }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${FULL_BROWSER}" == "true" ]]; then
            npm run test:e2e:compiled
          else
            npm run test:e2e:smoke:compiled
          fi
      - name: Verify static deployment contracts once
        run: deploy/scripts/verify-static.sh
      - name: Run deployment and recovery rehearsal
        if: needs.change-selection.outputs.deploy_integration == 'true'
        run: WEATHER_RUN_DEPLOY_INTEGRATION=1 node --test --test-concurrency=1 deploy/test/*.integration.test.mjs

  native-rust-arm64:
    name: Native Rust ARM64 parity
    needs: [change-selection, quality-gates]
    if: needs.change-selection.outputs.native_rust_arm64 == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 75
    steps:
      - name: Check out exact selected commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up native Node.js for the existing oracles
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version-file: .nvmrc
      - name: Install the pinned native Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          # verify the runner and both oracle and compiler architectures
          test "$(uname -m)" = aarch64
          test "$(node -p process.arch)" = arm64
          pinned=$(sed -nE 's/^channel = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' rust/rust-toolchain.toml)
          test -n "${pinned}"
          test -z "${RUSTUP_TOOLCHAIN+x}"
          rustup toolchain install "${pinned}" --profile minimal
          cd rust
          version=$(rustc -Vv)
          printf '%s\n' "${version}"
          test "$(awk '$1 == "release:" { print $2 }' <<< "${version}")" = "${pinned}"
          test "$(awk '$1 == "host:" { print $2 }' <<< "${version}")" = aarch64-unknown-linux-gnu
      - name: Install existing oracle dependencies
        run: npm ci
      - name: Compile existing TypeScript oracles once
        run: npm run build
      - name: Execute retained functional Rust parity suites on native ARM64
        env:
          CARGO_BUILD_JOBS: '1'
          RUST_TEST_THREADS: '1'
        shell: bash
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR
          CARGO_TARGET_DIR="$(mktemp -d "${RUNNER_TEMP}/weather-rust-arm64.XXXXXX")"
          trap 'rm -rf -- "${CARGO_TARGET_DIR}"' EXIT
          cd rust
          # fetch the same locked graph for the native target before offline tests
          cargo fetch --locked --target aarch64-unknown-linux-gnu
          # run one named functional suite and require executed tests
          run_native_suite() {
            local log="$CARGO_TARGET_DIR/test-result.log"
            cargo test --locked --offline --target aarch64-unknown-linux-gnu -p "$1" --test "$2" "${@:3}" |
              tee "$log"
            grep -Eq '^test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$log"
          }
          # run native runtime unit suites against the exact same locked target
          run_native_lib_suite() {
            local log="$CARGO_TARGET_DIR/test-result.log"
            cargo test --locked --offline --target aarch64-unknown-linux-gnu -p "$1" --lib "$2" "${@:3}" |
              tee "$log"
            grep -Eq '^test result: ok\. [1-9][0-9]* passed; 0 failed; 0 ignored;' "$log"
          }
          run_native_suite weather-adjustment temperature_mos_inference
          # retain exact public health and instant-bound history parity on the release target
          run_native_suite weather-api dispatch
          run_native_suite weather-api service matches_compiled_node_service_dispatch
          run_native_suite weather-api history
          run_native_suite weather-database history
          run_native_suite weather-api tides
          run_native_suite weather-database tides
          run_native_suite weather-edge native_public_assets
          run_native_suite weather-edge forecast_recorded_products
          run_native_lib_suite weather-edge edge_process_environment
          run_native_lib_suite weather-edge edge_startup_configuration
          run_native_suite weather-runtime ecowitt_scheduled
          run_native_suite weather-runtime native_cold_custody_command private_archive_native_http_transport_matches_node
          run_native_suite weather-runtime native_cold_custody_command native_evidence_command_emits_and_reenters_actual_ack
          run_native_suite weather-runtime native_evidence_read_commands
          run_native_suite weather-runtime native_evidence_gap_commands
          run_native_suite weather-runtime revision_cold_start native_evidence_cold_start_matches_node_database_envelopes
          run_native_suite weather-runtime shadow_metadata_custody
          run_native_suite weather-runtime native_edge_http_transport
          run_native_suite weather-runtime native_edge_process_http
          run_native_suite weather-runtime native_worker_process
          run_native_suite weather-runtime native_worker_health
          run_native_suite weather-runtime native_worker_catalogs
          run_native_suite weather-runtime native_rain_capture_values
          run_native_lib_suite weather-runtime native_open_meteo_values
          # exercise canonical grid-cell spelling and both actual provider call paths
          run_native_lib_suite weather-worker spells_javascript_coordinates
          run_native_lib_suite weather-runtime encoding_matches_common_javascript_number_spelling
          run_native_lib_suite weather-runtime open_meteo_previous_runs_provider::tests::grid_cell_preserves_javascript_number_spelling
          run_native_suite weather-runtime open_meteo_current
          run_native_suite weather-runtime open_meteo_previous_runs_provider
          run_native_lib_suite weather-runtime native_public_backfill_time
          run_native_lib_suite weather-runtime native_scheduled_values
          # exclude only the opt-in PostgreSQL 16 fixture from the standalone unit suite
