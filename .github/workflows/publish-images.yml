name: Publish production images

on:
  push:
    tags:
      - "20[0-9][0-9].[0-9][0-9].[0-9][0-9]-[0-9]+"

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    outputs:
      release: ${{ steps.release.outputs.release }}
    steps:
      - name: Check out exact release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - id: release
        name: Validate immutable release tag
        shell: bash
        run: |
          set -euo pipefail
          release=${GITHUB_REF_NAME}
          if [[ ! "${release}" =~ ^([0-9]{4})\.([0-9]{2})\.([0-9]{2})-([1-9][0-9]?)$ ]]; then
            echo "release tag must use YYYY.MM.DD-N" >&2
            exit 1
          fi
          release_date="${BASH_REMATCH[1]}-${BASH_REMATCH[2]}-${BASH_REMATCH[3]}"
          if [[ "$(date --date "${release_date}" +%Y-%m-%d)" != "${release_date}" ]]; then
            echo "release tag contains an invalid date" >&2
            exit 1
          fi
          tag_sha=$(git rev-parse "refs/tags/${release}^{commit}")
          if [[ "${tag_sha}" != "$(git rev-parse HEAD)" ]]; then
            echo "checked out commit does not match immutable tag" >&2
            exit 1
          fi
          printf 'release=%s\n' "${release}" >> "${GITHUB_OUTPUT}"
          printf 'sha=%s\n' "${tag_sha}" >> "${GITHUB_OUTPUT}"
      - name: Wait for successful exact-SHA branch Check
        env:
          CI_CHECK_MODE: release
          CI_SHA: ${{ steps.release.outputs.sha }}
          CI_REPOSITORY_ID: ${{ github.repository_id }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/await-check.mjs

  dependency-manifests:
    needs: validate-release
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Resolve pinned dependency ARM64 digests
        shell: bash
        run: |
          set -euo pipefail
          : > dependency-images.env
          while read -r variable image; do
            reference=$(docker buildx imagetools inspect "${image}" --raw |
              node deploy/scripts/resolve-image.mjs "${image}")
            printf '%s=%s\n' "${variable}" "${reference}" >> dependency-images.env
          done <<'IMAGES'
          POSTGRES_IMAGE postgres:17.10-bookworm
          CLOUDFLARED_IMAGE cloudflare/cloudflared:2026.7.2
          IMAGES
          docker run --rm --platform linux/arm64 postgres:17.10-bookworm \
            postgres --version | grep -E '^postgres \(PostgreSQL\) (1[7-9]|[2-9][0-9])\.'
      - name: Retain dependency digest references
        uses: actions/upload-artifact@v4
        with:
          name: dependency-image-digests
          path: dependency-images.env

  publish:
    needs: [validate-release, dependency-manifests]
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build inspectable native ARM64 images
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build --platform linux/arm64 --target server \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --tag weather-server:inspect --load .
          docker buildx build --platform linux/arm64 --target web \
            --build-arg "WEATHER_WEB_REVISION=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --tag weather-web:inspect --load .
      - name: Extract exact build-stage comparison files
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build --platform linux/arm64 --target image-check-files \
            --output "type=local,dest=${RUNNER_TEMP}/weather-image-check-files" .
      - name: Verify exact production image boundary
        env:
          WEATHER_RUN_DEPLOY_INTEGRATION: '1'
          WEATHER_TEST_SERVER_IMAGE: weather-server:inspect
          WEATHER_TEST_WEB_IMAGE: weather-web:inspect
          WEATHER_TEST_BUILD_PACKAGE_ROOT: ${{ runner.temp }}/weather-image-check-files/forecast-adjustment
          WEATHER_TEST_BUILD_WEB_CONTRACT: ${{ runner.temp }}/weather-image-check-files/web/adjustment-maintenance-contract.mjs
        run: node --test deploy/test/forecast-adjustment-image.integration.test.mjs
      - name: Publish validated native ARM64 images
        env:
          RELEASE: ${{ needs.validate-release.outputs.release }}
        shell: bash
        run: |
          set -euo pipefail
          # the same builder reuses the inspected compilation layers
          for target in server web; do
            docker buildx build --platform linux/arm64 --target "${target}" \
              --build-arg "WEATHER_WEB_REVISION=${GITHUB_SHA}" \
              --provenance=true --push \
              --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
              --tag "ghcr.io/anstosa/weather-${target}:${RELEASE}" .
          done
      - name: Resolve published ARM64 digests
        env:
          RELEASE: ${{ needs.validate-release.outputs.release }}
        shell: bash
        run: |
          set -euo pipefail
          for target in server web; do
            image="ghcr.io/anstosa/weather-${target}:${RELEASE}"
            reference=$(docker buildx imagetools inspect "${image}" --raw |
              node deploy/scripts/resolve-image.mjs "${image}")
            remote_config=$(docker buildx imagetools inspect "${reference}" --raw |
              node -e 'let raw = ""; process.stdin.on("data", (part) => raw += part); process.stdin.on("end", () => process.stdout.write(JSON.parse(raw).config?.digest ?? ""))')
            local_config=$(docker image inspect "weather-${target}:inspect" --format '{{.Id}}')
            if [[ "${remote_config}" != "${local_config}" ]]; then
              echo "published ${target} image differs from inspected candidate" >&2
              exit 1
            fi
            variable=$(printf '%s' "${target}" | tr '[:lower:]' '[:upper:]')
            printf 'WEATHER_%s_IMAGE=%s\n' "${variable}" "${reference}" > "${target}-image-digest.env"
          done
      - name: Retain server digest reference
        uses: actions/upload-artifact@v4
        with:
          name: server-image-digest
          path: server-image-digest.env
      - name: Retain web digest reference
        uses: actions/upload-artifact@v4
        with:
          name: web-image-digest
          path: web-image-digest.env
