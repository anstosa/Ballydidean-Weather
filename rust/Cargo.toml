[workspace]
resolver = "3"
members = [
  "crates/weather-api",
  "crates/weather-contracts",
  "crates/weather-database",
  "crates/weather-domain",
  "crates/weather-edge",
  "crates/weather-providers",
  "crates/weather-runtime",
  "crates/weather-adjustment",
  "crates/weather-worker",
]

[workspace.dependencies]
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
flate2 = { version = "=1.1.11", default-features = false, features = ["zlib-rs"] }
getrandom = { version = "=0.4.3", default-features = false }
jiff = { version = "=1.0.3", default-features = false, features = ["std"] }
serde = { version = "=1.0.229", default-features = false, features = ["std"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std", "float_roundtrip", "raw_value"] }
scrypt = { version = "=0.12.0", default-features = false }
sha2 = { version = "=0.11.1", default-features = false }
subtle = { version = "=2.6.1", default-features = false }
url = { version = "=2.5.9", default-features = false, features = ["std"] }
hyper = { version = "=1.12.0", default-features = false, features = ["server", "client", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio", "client-legacy", "http1"] }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "net", "time", "sync", "signal"] }
http-body-util = { version = "=0.1.5", default-features = false }
hyper-rustls = { version = "=0.27.10", default-features = false, features = ["http1", "tls12", "ring"] }
rustls = { version = "=0.23.46", default-features = false, features = ["std", "ring", "tls12"] }
rustls-native-certs = { version = "=0.8.5", default-features = false }
tokio-postgres = { version = "=0.7.18", default-features = false, features = ["runtime", "with-serde_json-1", "with-uuid-1"] }
tokio-postgres-rustls = { version = "=0.14.0", default-features = false, features = ["ring"] }
uuid = { version = "=1.29.3", default-features = false }
regex = { version = "=1.13.2", default-features = false, features = ["std", "unicode-case"] }
bytes = { version = "=1.12.2", default-features = false }
libc = { version = "=0.2.191", default-features = false }
